# Builds the Windows installer (NSIS) when a version tag is pushed and publishes it as a GitHub
# release. Settings → Updates in the app lists these releases (published, tag vX.Y.Z, a *-setup.exe
# asset), so the tag must match the version in tauri.conf.json and Cargo.toml.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the app version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          echo "tag $tag, tauri.conf.json $conf, Cargo.toml $cargo"
          [ "$tag" = "$conf" ] && [ "$tag" = "$cargo" ] || { echo "::error::Tag $GITHUB_REF_NAME doesn't match the app version"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Test
        working-directory: src-tauri
        run: cargo test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: cargo tauri
          tagName: ${{ github.ref_name }}
          releaseName: Onsite ${{ github.ref_name }}
          releaseBody: |
            Install VoiceStudio first, then run the Onsite installer (`Onsite_*_x64-setup.exe` below).
            On first launch, pick an AI in Settings: Claude Code (Pro/Max), or paste a Claude, OpenAI, Gemini or Groq API key (Gemini and Groq have free tiers).
            Already installed? Settings → Updates → Check for updates installs this version.
          # Published, not draft: the app's Updates screen skips drafts.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
