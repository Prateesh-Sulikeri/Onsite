# Shared by release.yml (stable and tag-based experimental) and experimental.yml (every push to m1).
# Builds Windows, macOS and Linux, then (when `tag` is set) adds SHA256SUMS.txt and un-drafts the release.
# Not run on its own; the caller creates the draft release and passes its id.
name: Build

on:
  workflow_call:
    inputs:
      release_id:
        description: Draft release the builds upload to. Empty = dry run (files kept as workflow artifacts).
        type: string
        default: ""
      tag:
        description: Release tag to publish when every build succeeded. Empty = don't publish.
        type: string
        default: ""
      version:
        description: Version to write into tauri.conf.json and Cargo.toml before building (CI only, not committed). Empty = keep.
        type: string
        default: ""
      dry_run:
        type: boolean
        default: false

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
          - os: ubuntu-22.04
            args: --bundles appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set the app version (CI only)
        if: inputs.version != ''
        shell: bash
        env:
          V: ${{ inputs.version }}
        run: |
          perl -0pi -e 's/"version":\s*"[^"]*"/"version": "$ENV{V}"/' src-tauri/tauri.conf.json
          perl -0pi -e 's/^version\s*=\s*"[^"]*"/version = "$ENV{V}"/m' src-tauri/Cargo.toml
          grep -m1 '"version"' src-tauri/tauri.conf.json
          grep -m1 '^version' src-tauri/Cargo.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux build packages
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libssl-dev
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}
      # The npm package ships a prebuilt CLI: seconds, where `cargo install tauri-cli` compiled for ~5 min.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the Tauri CLI
        run: npm install -g @tauri-apps/cli@^2
      - name: Test
        working-directory: src-tauri
        run: cargo test
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tauriScript: tauri
          args: ${{ matrix.args }}
          releaseId: ${{ inputs.release_id }}
      - name: Keep the files (dry run)
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: onsite-${{ matrix.os }}
          path: |
            src-tauri/target/**/bundle/nsis/*-setup.exe
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/appimage/*.AppImage
            src-tauri/target/**/bundle/deb/*.deb

  publish:
    needs: build
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
          mkdir files && cd files
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p 'Onsite_*'
          sha256sum Onsite_* > SHA256SUMS.txt && cat SHA256SUMS.txt
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" SHA256SUMS.txt --clobber
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false
