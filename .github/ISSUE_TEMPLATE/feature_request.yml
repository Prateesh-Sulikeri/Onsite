name: Idea
description: Suggest a feature, round type, question or company.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would help
      description: What you're trying to practise or do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How it could work. Rough is fine.
