name: Bug report
description: Something doesn't work.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste an API key here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Onsite version
      description: Settings → Updates.
      placeholder: 0.1.2
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System
      options: [Windows, macOS, Linux (AppImage), Linux (.deb)]
    validations:
      required: true
  - type: dropdown
    id: ai
    attributes:
      label: AI
      options: [Claude Code, Claude API, OpenAI, Gemini, Groq]
    validations:
      required: true
  - type: dropdown
    id: voice
    attributes:
      label: Round type
      options: [Typed, Spoken (VoiceStudio), Not in a round]
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Settings → Storage → Open log folder. Paste the lines around the problem. Remove anything private.
      render: text
