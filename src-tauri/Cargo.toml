[package]
name = "onsite"
version = "0.1.2"
description = "Local AI mock-interview loops"
license = "MIT"
repository = "https://github.com/Prateesh-Sulikeri/Onsite"
edition = "2021"
publish = false

[lib]
name = "onsite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
tempfile = "3"
indexmap = { version = "2", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
cpal = "0.18.2"
futures-util = "0.3.34"
tokio-tungstenite = "0.30.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "multipart", "native-tls"] }
csv = "1"
pdf-extract = "0.12.1"
quick-xml = "0.42"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }
regex = "1"
base64 = "0.23"
unicode-normalization = "0.1"
sherpa-onnx = "2.0.1"
tar = "0.4"
bzip2 = "0.6"
fs4 = "1.1.0"
